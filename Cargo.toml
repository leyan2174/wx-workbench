[package]
name = "wx-cli"
version = "0.3.0"
edition = "2021"
default-run = "wx"
description = "Windows WeChat 4.x local data CLI: decrypt databases, query and export records"
license = "Apache-2.0"
repository = "https://github.com/jackwener/wx-cli"
keywords = ["wechat", "sqlcipher", "decrypt", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = [".claude/**", ".codex/**", "**/*.log", "docs/diagrams/history/**", "docs/diagrams/**/*.png"]

[[bin]]
name = "wx"
path = "src/main.rs"

[[bin]]
name = "wx-toolbox"
path = "src/toolbox_main.rs"
test = false
bench = false

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# 异步
# 保留已修复阻塞任务调度问题的运行时最低版本。
tokio = { version = "1.52.4", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
csv = "1"
encoding_rs = "0.8"

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# 加密
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"

# 解压
zstd = "0.13"

# 错误处理
anyhow = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 跨平台路径
dirs = "5"

# MD5 (联系人表名 Msg_<md5>)
md5 = "0.7"

# 附件 ID 编码（base64url）
base64 = "0.22"

# 正则表达式
regex = "1"
roxmltree = "0.20"
zeroize = "1"

# 原生 SILK SDK、同卷临时文件及文件身份校验
silk-codec = { version = "=0.3.1", default-features = false }
tempfile = "3"
same-file = "1"
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }

# IPC Windows named pipe
[target.'cfg(windows)'.dependencies]
interprocess = { version = "2", features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
frida = { version = "=0.17.2", features = ["auto-download"] }
windows = { version = "0.58", features = [
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
