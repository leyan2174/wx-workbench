name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Configure libclang
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$clang\libclang.dll")) { throw 'libclang.dll is required' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
      - name: Check
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/wx.exe wx-windows-x86_64.exe
          New-Item -ItemType Directory -Force npm/platforms/win32-x64/bin | Out-Null
          Copy-Item wx-windows-x86_64.exe npm/platforms/win32-x64/bin/wx.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wx-windows-x86_64
          path: |
            wx-windows-x86_64.exe
            THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: npm-win32-x64
          path: npm/platforms/win32-x64/bin/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            wx-windows-x86_64.exe
            THIRD_PARTY_NOTICES.md

  publish-npm:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: npm-win32-x64
          path: npm/platforms/win32-x64/bin/
      - name: Publish Windows package
        working-directory: npm/platforms/win32-x64
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package
        working-directory: npm/wx-cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
