<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>wx-workbench · 微信本地数据工作台</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#messages">跳到消息记录</a>
  <header class="topbar">
    <button id="sidebar-toggle" class="icon-button mobile-only" aria-label="任务与队列" title="任务与队列" aria-expanded="false" data-icon="list-checks"></button>
    <h1>微信本地数据工作台</h1>
    <span class="local-label">本地</span>
    <div class="top-status"><span id="connection" class="status" role="status">未连接</span><span id="account-summary">账号未读取</span></div>
    <button id="refresh-all" class="icon-button" title="刷新工作台" aria-label="刷新工作台" data-icon="refresh-cw"></button>
    <button id="query-open" class="icon-button" title="资料查询" aria-label="资料查询" data-icon="search"></button>
    <button id="settings-open" class="icon-button" title="设置与账号" aria-label="设置与账号" data-icon="settings"></button>
  </header>
  <div id="global-error" class="notice error" role="alert" hidden></div>
  <main class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="任务与运行队列">
      <section class="tools"><h2>任务工具</h2><div id="task-tools"></div></section>
      <section class="queue-section">
        <div class="section-heading"><h2>运行队列 <span id="queue-count" class="count">0</span></h2><button id="refresh-tasks" class="icon-button" title="刷新任务" aria-label="刷新任务" data-icon="refresh-cw"></button></div>
        <label class="sr-only" for="queue-filter">任务状态</label><select id="queue-filter"><option value="all">全部任务</option><option value="active">等待与运行中</option><option value="failed">失败任务</option><option value="completed">已结束</option></select>
        <div id="queue" class="queue" aria-live="polite"><p class="empty">尚未加载任务</p></div>
      </section>
      <footer class="sidebar-footer"><span id="updated-at">尚未同步</span></footer>
    </aside>
    <section class="directory" aria-label="会话和联系人">
      <div class="directory-head"><div class="tabs" role="tablist" aria-label="记录类型"><button id="sessions-tab" role="tab" aria-selected="true" aria-controls="directory-list" data-view="sessions">会话</button><button id="contacts-tab" role="tab" aria-selected="false" aria-controls="directory-list" tabindex="-1" data-view="contacts">联系人</button></div><span id="directory-count" class="count">0</span></div>
      <div class="filters">
        <label class="search"><span data-icon="search" aria-hidden="true"></span><input id="directory-search" type="search" placeholder="搜索名称、微信号" aria-label="搜索会话或联系人" autocomplete="off"></label>
        <div class="filter-row"><select id="type-filter" aria-label="会话类型"><option value="">全部类型</option><option value="direct">单聊</option><option value="group">群聊</option><option value="public">公众号</option></select><select id="tag-filter" aria-label="联系人标签"><option value="">全部标签</option></select></div>
      </div>
      <div id="directory-list" class="directory-list" role="tabpanel" aria-labelledby="sessions-tab"><p class="empty">正在连接本地服务…</p></div>
      <p id="directory-limit" class="directory-limit" hidden>当前显示前 2000 条记录</p>
    </section>
    <section class="conversation" aria-label="消息记录">
      <header class="conversation-head"><button id="back-directory" class="icon-button mobile-only" title="返回会话" aria-label="返回会话" data-icon="chevron-left"></button><div class="conversation-title"><h2 id="chat-title">消息记录</h2><p id="chat-subtitle">未选择会话</p></div><button id="export-chat" class="icon-button" title="导出当前会话" aria-label="导出当前会话" data-icon="download" disabled></button></header>
      <div class="message-filters"><label class="search"><span data-icon="search" aria-hidden="true"></span><input id="message-search" type="search" placeholder="筛选本页消息" aria-label="筛选本页消息"></label><select id="message-type" aria-label="本页消息类型"><option value="">全部消息</option><option value="text">文字</option><option value="image">图片</option><option value="voice">语音</option><option value="video">视频</option><option value="file">文件</option><option value="other">其他</option></select><button id="refresh-history" class="icon-button" title="刷新消息" aria-label="刷新消息" data-icon="refresh-cw" disabled></button></div>
      <div class="media-toolbar"><button id="preview-images" title="当前会话图片" disabled><span data-icon="image" aria-hidden="true"></span>图片</button></div>
      <div id="history-error" class="notice error" role="alert" hidden></div>
      <div id="messages" class="messages" tabindex="0" aria-label="消息列表"><p class="empty">选择会话查看消息记录</p></div>
      <footer class="pagination"><span id="message-count" role="status">暂无记录</span><label>每页 <select id="page-size"><option>50</option><option selected>100</option><option>200</option></select></label><button id="previous-page" class="icon-button" aria-label="上一页" title="上一页" data-icon="chevron-left" disabled></button><span id="page-label">1</span><button id="next-page" class="icon-button" aria-label="下一页" title="下一页" data-icon="chevron-right" disabled></button></footer>
    </section>
  </main>
  <dialog id="task-dialog" aria-labelledby="task-title">
    <form id="task-form"><header class="dialog-head"><h2 id="task-title">新建任务</h2><button type="button" class="icon-button" data-close="task-dialog" data-icon="x" title="关闭" aria-label="关闭"></button></header><div class="dialog-body"><div id="task-options"></div><div id="task-error" class="notice error" role="alert" hidden></div></div><footer class="dialog-footer"><button type="button" data-close="task-dialog">返回</button><button id="task-submit" class="primary" type="submit"><span data-icon="play" aria-hidden="true"></span>加入队列</button></footer></form>
  </dialog>
  <dialog id="task-detail-dialog" class="wide-dialog" aria-labelledby="detail-title">
    <header class="dialog-head"><div><h2 id="detail-title">任务详情</h2><p id="detail-id" class="muted"></p></div><button class="icon-button" data-close="task-detail-dialog" data-icon="x" title="关闭" aria-label="关闭"></button></header>
    <div class="dialog-body"><div id="detail-meta"></div><div id="detail-error" class="notice error" role="alert" hidden></div><section aria-label="聊天导出结果"><h3>聊天导出结果</h3><div id="task-result"></div><div id="task-artifacts" aria-live="polite"></div></section><div class="section-heading"><h3>任务日志</h3><label class="check"><input type="checkbox" id="follow-log" checked>跟随日志</label><button id="download-log" class="icon-button" title="下载当前日志" aria-label="下载当前日志" data-icon="download"></button></div><pre id="task-log" tabindex="0" aria-label="任务日志"></pre></div>
    <footer class="dialog-footer"><button id="detail-refresh"><span data-icon="refresh-cw" aria-hidden="true"></span>刷新</button><button id="cancel-task" class="danger"><span data-icon="square" aria-hidden="true"></span>取消任务</button></footer>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><header class="dialog-head"><h2 id="settings-title">设置与账号</h2><button class="icon-button" data-close="settings-dialog" data-icon="x" title="关闭" aria-label="关闭"></button></header><div class="dialog-body"><h3>当前账号</h3><dl id="account-state" class="key-values"></dl><h3>显示设置</h3><label class="check"><input id="compact-mode" type="checkbox" checked>紧凑消息间距</label><label class="check"><input id="live-mode" type="checkbox" checked>实时更新</label><h3>连接认证</h3><form id="token-form"><label>访问令牌<input id="token-input" type="password" autocomplete="off" spellcheck="false" required></label><div class="dialog-footer"><button id="forget-token" type="button">清除认证</button><button class="primary" type="submit">连接</button></div></form><p id="auth-state" class="muted" role="status"></p></div></dialog>
  <dialog id="images-dialog" class="wide-dialog" aria-labelledby="images-title">
    <header class="dialog-head"><h2 id="images-title">会话图片</h2><button class="icon-button" data-close="images-dialog" data-icon="x" title="关闭图片" aria-label="关闭图片"></button></header>
    <div id="images-error" class="notice error" role="alert" hidden></div>
    <div class="image-browser"><div id="image-list" aria-label="会话图片列表"></div><div id="image-preview" aria-live="polite"></div></div>
    <footer class="pagination"><button id="images-refresh" class="icon-button" data-icon="refresh-cw" title="刷新图片" aria-label="刷新图片"></button><button id="images-previous" class="icon-button" data-icon="chevron-left" title="上一页图片" aria-label="上一页图片" disabled></button><span id="images-page" role="status">1</span><button id="images-next" class="icon-button" data-icon="chevron-right" title="下一页图片" aria-label="下一页图片" disabled></button></footer>
  </dialog>
  <dialog id="query-dialog" class="wide-dialog" aria-labelledby="query-title">
    <header class="dialog-head"><h2 id="query-title">资料查询</h2><button class="icon-button" data-close="query-dialog" data-icon="x" title="关闭查询" aria-label="关闭查询"></button></header>
    <div class="dialog-body">
      <form id="query-form"><label>资料类型<select id="query-kind"><option value="search">消息搜索</option><option value="unread">未读会话</option><option value="members">群成员</option><option value="stats">聊天统计</option><option value="favorites">收藏</option><option value="articles">公众号文章</option><option value="sns-feed">朋友圈</option><option value="sns-search">朋友圈搜索</option><option value="sns-notifications">朋友圈互动</option><option value="voice-messages">语音目录</option></select></label><div id="query-fields" class="query-fields"></div><button id="query-submit" type="submit" class="primary"><span data-icon="search" aria-hidden="true"></span>查询</button></form>
      <div id="query-error" class="notice error" role="alert" hidden></div>
      <p id="query-status" role="status">尚未查询</p>
      <div id="query-results" class="query-results" aria-live="polite"></div>
    </div>
    <footer class="dialog-footer"><button id="query-previous" class="icon-button" data-icon="chevron-left" title="上一页语音" aria-label="上一页语音" disabled></button><span id="query-page"></span><button id="query-next" class="icon-button" data-icon="chevron-right" title="下一页语音" aria-label="下一页语音" disabled></button></footer>
  </dialog>
  <dialog id="message-detail-dialog" class="wide-dialog" aria-labelledby="message-detail-title"><header class="dialog-head"><h2 id="message-detail-title">消息详情</h2><button class="icon-button" data-close="message-detail-dialog" data-icon="x" title="关闭详情" aria-label="关闭详情"></button></header><div class="dialog-body"><form id="message-detail-form" class="query-fields"><label>内容类型<select id="message-detail-kind"><option value="refer">引用</option><option value="file-message">文件</option><option value="record-item">合并记录条目</option><option value="transfer">转账</option><option value="location">位置</option></select></label><label id="message-item-field" hidden>条目序号（从 0 开始）<input id="message-item-index" type="number" min="0" step="1" value="0"></label><button class="primary" type="submit">查询详情</button></form><div id="message-detail-error" class="notice error" role="alert" hidden></div><div id="message-detail-result" aria-live="polite"></div></div></dialog>
  <noscript>工作台需要启用 JavaScript。</noscript>
</body>
</html>
