[package]
name = "mcp-voice-host-security"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"
[workspace]
[lib]
path = "lib.rs"
[[bin]]
name = "host-security-probe"
path = "host.rs"
[[bin]]
name = "synthetic-asr"
path = "fake.rs"
[[test]]
name = "audit"
path = "audit.rs"
[dependencies]
zstd = "0.13"
mcp-voice-host = { path = "../mcp-voice-host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
interprocess = { version = "2", features = ["tokio"] }
dirs = "5"
chrono = "0.4"
tempfile = "3"
zeroize = "1"
md5 = "0.7"
sha2 = "0.10"
same-file = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell"] }
[dev-dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = "0.12"

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
prettyplease = "0.2"
