[package]
name = "plan-selection"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[features]
runtime = []

[[test]]
name = "runtime"
path = "runtime.rs"
required-features = ["runtime"]

[dependencies]
anyhow = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
zeroize = "1"
serde_json = "1"
chrono = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
tempfile = "3"
md5 = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
interprocess = { version = "2", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
