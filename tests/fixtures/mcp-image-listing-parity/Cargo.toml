[package]
name = "mcp-image-listing-parity"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
md5 = "0.7"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
