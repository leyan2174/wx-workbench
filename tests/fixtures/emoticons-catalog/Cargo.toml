[package]
name = "emoticons-catalog-fixture"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
tempfile = "3"
md5 = "0.7"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
zeroize = "1"
same-file = "1"
dirs = "5"
chrono = "0.4"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }
