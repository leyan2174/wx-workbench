[package]
name = "native-image-fixture"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"
doctest = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
rusqlite = { version = "0.31", features = ["bundled"] }
aes = "0.8"
md5 = "0.7"
chrono = "0.4"
base64 = "0.22"
tempfile = "3"
same-file = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
