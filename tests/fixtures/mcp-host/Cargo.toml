[package]
name = "mcp-host"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "lib.rs"
[dependencies]
zstd = "0.13"
anyhow = "1"
regex = "1"
roxmltree = "0.20"
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Cryptography"] }
tokio = { version = "1", features = ["full"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
sha2 = "0.10"
same-file = "1"
tempfile = "3"
zeroize = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
md5 = "0.7"
base64 = "0.22"
dirs = "5"
