[package]
name = "attachment-refs-contract"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
md5 = "0.7"
regex = "1"
roxmltree = "0.20"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }

[dev-dependencies]
tempfile = "3"
