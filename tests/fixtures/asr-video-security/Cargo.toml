[package]
name = "asr-video-security-harness"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[test]]
name = "asr_video_security"
path = "../../asr_video_security.rs"

[dependencies]
regex = "1"
zstd = "0.13"
anyhow = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = "0.12"
dirs = "5"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
sha2 = "0.10"
zeroize = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
md5 = "0.7"
same-file = "1"
silk-codec = { version = "=0.3.1", default-features = false }
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_Security"] }
