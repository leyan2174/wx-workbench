[package]
name = "asr-video-security-harness"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
sns-wasm-test-asset = []

[[test]]
name = "asr_video_security"
path = "../../asr_video_security.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "=1.0.140"
tempfile = "3"
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
sha2 = "0.10"
zeroize = "1"
