[package]
name = "sns-download-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "harness.rs"

[dependencies]
anyhow = "1"
same-file = "1"
tempfile = "3"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
md5 = "0.7"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
dirs = "5"
chrono = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Com", "Win32_UI_Shell"] }
