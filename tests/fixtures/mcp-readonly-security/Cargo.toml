[package]
name = "mcp-readonly-security-harness"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"
test = false
doctest = false

[[test]]
name = "security"
path = "security.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
md5 = "0.7"
regex = "1"
roxmltree = "0.20"
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
base64 = "0.22"
