[package]
name = "wav-publish-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"
test = false
doctest = false

[[test]]
name = "publisher"
path = "runtime.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
tempfile = "3"
sha2 = "0.10"
same-file = "1"
zeroize = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
silk-codec = { version = "=0.3.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
