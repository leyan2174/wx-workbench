[package]
name = "wav-publish-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"
test = false
doctest = false

[[test]]
name = "publisher"
path = "runtime.rs"

[dependencies]
regex = "1"
zstd = "0.13"
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
tempfile = "3"
sha2 = "0.10"
same-file = "1"
zeroize = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = "0.12"
dirs = "5"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
silk-codec = { version = "=0.3.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security"] }
