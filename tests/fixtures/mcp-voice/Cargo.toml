[package]
name = "mcp-voice-harness"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "lib.rs"
[dependencies]
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
same-file = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
