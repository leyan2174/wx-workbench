[package]
name = "mcp-voice-security-harness"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
zstd = "0.13"
anyhow = "1"
roxmltree = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
same-file = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
md5 = "0.7"
serde_json = "1"
zeroize = "1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
