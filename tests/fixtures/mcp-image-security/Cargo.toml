[package]
name = "mcp-image-security"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"
test = false
doctest = false

[[test]]
name = "audit"
path = "audit.rs"

[[bin]]
name = "host-probe"
path = "host_probe.rs"
test = false

[dependencies]
wx-mcp-cli-harness = { path = "../mcp-cli" }
native-image-fixture = { path = "../native-image" }
mcp-readonly-security-harness = { path = "../mcp-readonly-security" }
anyhow = "1"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
regex = "1"
md5 = "0.7"
same-file = "1"
tempfile = "3"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "fs"] }

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading"] }
